[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
xfail_strict = true
markers =
    integration: hits the Flask test client + tmp databases
    external: tests for external integrations (mocked)
    slow: longer-running tests
filterwarnings =
    ignore::DeprecationWarning:peewee.*
    ignore::DeprecationWarning:pandas.*
