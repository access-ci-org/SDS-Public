[supervisord]
nodaemon=true
logfile=/sds/data/state/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/sds/data/state/logs/nginx.log
stderr_logfile=/sds/data/state/logs/nginx.log
autorestart=true

[program:sds-app]
command=/sds/entrypoint.sh
stdout_logfile=/sds/data/state/logs/sds-stdout.log
stderr_logfile=/sds/data/state/logs/sds-stdout.log
autorestart=true

[program:sds-mcp]
command=/sds/env/SDS_ENV/bin/sds-mcp
directory=/sds/mcp
; streamable-http transport, bound to loopback; nginx fronts it at /mcp.
; SDS_API_URL points back at the Flask app over loopback. No SDS_API_KEY here:
; each user's bearer token is forwarded per-request (see client.py).
environment=MCP_TRANSPORT="streamable-http",MCP_HOST="127.0.0.1",MCP_PORT="9000",SDS_API_URL="http://127.0.0.1:8080/api/v1"
stdout_logfile=/sds/data/state/logs/sds-mcp.log
stderr_logfile=/sds/data/state/logs/sds-mcp.log
autorestart=true
