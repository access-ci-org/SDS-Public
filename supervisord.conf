[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log
autorestart=true

[program:sds-app]
command=/sds/entrypoint.sh
stdout_logfile=/var/log/supervisor/sds.log
stderr_logfile=/var/log/supervisor/sds.log
autorestart=true