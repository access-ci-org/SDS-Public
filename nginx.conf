# Comment this section out for SSL configuration

error_log /sds/data/state/logs/nginx-error.log warn;

server {
	listen 80;
	server_name localhost;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	location /mcp {
		proxy_pass http://127.0.0.1:9000;
		proxy_http_version 1.1;
		# FastMCP auto-enables DNS-rebinding protection on its loopback bind and
		# only accepts a Host of 127.0.0.1:<port>/localhost:<port>. Forward the
		# upstream's host:port ($proxy_host = 127.0.0.1:9000) so it validates
		# regardless of the public hostname; $host would arrive port-stripped.
		proxy_set_header Host $proxy_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Streamable HTTP keeps a long-lived stream open; don't buffer it.
		proxy_buffering off;
		proxy_read_timeout 3600s;
		proxy_set_header Connection "";
	}

	access_log /sds/data/state/logs/nginx-access.log;
}

