# Smoke fixture: an operator SSL config in the pre-v1.4.0 template shape —
# 443-only vhost, /var/log/supervisor log paths, no /mcp location. Mounted
# over /etc/nginx/sites-available/default by compose.ssl.yml.

error_log /var/log/supervisor/nginx-error.log warn;

server {
	listen 443 ssl;
	server_name localhost;

	ssl_certificate /etc/nginx/ssl/cert.pem;
	ssl_certificate_key /etc/nginx/ssl/key.pem;

	location / {
		proxy_pass http://127.0.0.1:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}

	access_log /var/log/supervisor/nginx-access.log;

	client_max_body_size 100M;
}
